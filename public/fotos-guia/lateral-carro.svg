<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <title>Foto lateral del carro: el carro completo, de costado, de rueda a rueda</title>
  <defs>
    <linearGradient id="carroceria" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#005b96"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe2f6"/>
      <stop offset="1" stop-color="#8fb6dd"/>
    </linearGradient>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1fc"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="10" fill="url(#cielo)"/>
  <rect x="0" y="146" width="320" height="34" fill="#dfe7ef"/>
  <ellipse cx="160" cy="148" rx="128" ry="7" fill="#17324d" opacity=".15"/>
  <!-- carrocería -->
  <path d="M38 118 L40 96 Q42 88 54 86 L96 80 L126 56 Q132 52 142 52 L206 52 Q216 52 224 58 L254 82 L274 86 Q286 90 286 102 L286 118 Q286 124 280 124 L44 124 Q38 124 38 118 Z" fill="url(#carroceria)" stroke="#17324d" stroke-width="2.5"/>
