  <path d="M106 80 L132 60 Q136 58 142 58 L168 58 L168 80 Z" fill="url(#vidrio)" stroke="#17324d" stroke-width="2"/>
  <path d="M174 58 L204 58 Q212 58 218 64 L240 80 L174 80 Z" fill="url(#vidrio)" stroke="#17324d" stroke-width="2"/>
  <!-- puertas -->
  <path d="M170 84 V120 M108 84 L104 120" stroke="#17324d" stroke-width="2" opacity=".55"/>
  <path d="M146 92 h12 M210 92 h12" stroke="#e8f1fc" stroke-width="3" stroke-linecap="round"/>
  <!-- línea de brillo -->
  <path d="M48 100 H278" stroke="#ffffff" stroke-width="2" opacity=".35"/>
  <!-- espejo -->
  <path d="M100 82 L92 78 L92 84 Z" fill="#17324d"/>
  <!-- luces -->
  <rect x="276" y="94" width="10" height="7" rx="2" fill="#fab219"/>
  <rect x="38" y="96" width="8" height="8" rx="2" fill="#d03b3b"/>
  <!-- ruedas -->
  <g>
    <circle cx="88" cy="124" r="22" fill="#17324d"/>
    <circle cx="88" cy="124" r="13" fill="#c9d3dd"/>
    <g stroke="#7d8a96" stroke-width="3" stroke-linecap="round"><path d="M88 113v22M77 124h22M80 116l16 16M96 116l-16 16"/></g>
    <circle cx="88" cy="124" r="4" fill="#17324d"/>
  </g>
  <g>
    <circle cx="236" cy="124" r="22" fill="#17324d"/>
    <circle cx="236" cy="124" r="13" fill="#c9d3dd"/>
    <g stroke="#7d8a96" stroke-width="3" stroke-linecap="round"><path d="M236 113v22M225 124h22M228 116l16 16M244 116l-16 16"/></g>
    <circle cx="236" cy="124" r="4" fill="#17324d"/>
