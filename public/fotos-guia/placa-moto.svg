<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <title>Foto de la placa de la moto: de cerca, la placa trasera completa y legible</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1fc"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>
    <linearGradient id="cola" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#005b96"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="10" fill="url(#fondo)"/>
  <!-- llanta trasera asomando -->
  <path d="M128 180 Q128 150 160 146 Q192 150 192 180 Z" fill="#17324d"/>
  <!-- colín de la moto -->
  <path d="M96 26 L224 26 L206 58 L114 58 Z" fill="url(#cola)" stroke="#17324d" stroke-width="2.5"/>
  <!-- stop -->
  <rect x="136" y="34" width="48" height="12" rx="6" fill="#d03b3b" stroke="#17324d" stroke-width="2"/>
  <!-- direccionales -->
  <path d="M110 46 L86 50" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>
  <rect x="74" y="45" width="14" height="10" rx="3" fill="#fab219" stroke="#17324d" stroke-width="2"/>
  <path d="M210 46 L234 50" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>
  <rect x="232" y="45" width="14" height="10" rx="3" fill="#fab219" stroke="#17324d" stroke-width="2"/>
  <!-- soporte -->
  <rect x="152" y="58" width="16" height="14" fill="#17324d"/>
  <!-- placa -->
  <rect x="104" y="70" width="112" height="70" rx="8" fill="#fdd31d" stroke="#17324d" stroke-width="4"/>
  <rect x="110" y="76" width="100" height="58" rx="5" fill="none" stroke="#17324d" stroke-width="1.5" opacity=".5"/>
  <text x="160" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#17324d">ABC</text>
  <text x="160" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#17324d">12D</text>
  <text x="160" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="6" fill="#17324d">BOGOTÁ D.C.</text>
  <!-- visor de cámara -->
  <g stroke="#005b96" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M14 38V14h24M282 14h24v24M306 142v24h-24M38 166H14v-24"/>
  </g>
</svg>
